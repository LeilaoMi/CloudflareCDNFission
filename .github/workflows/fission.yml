name: Fission

on:
  schedule:
    - cron: "30 20 * * *"   # 每天北京时间 04:30
  workflow_dispatch:
    inputs:
      max_seeds:
        description: "最多用多少个种子做裂变（/24 去重后，0 = 只跑 Netlas）"
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: fission
  cancel-in-progress: false

jobs:
  fission:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --only-binary :all: --require-hashes -r requirements.txt
      - name: Seeds
        env:
          FISSION_SEEDS: ${{ secrets.FISSION_SEEDS }}
        run: |
          if [ -n "$FISSION_SEEDS" ]; then printf '%s\n' "$FISSION_SEEDS" >> seeds.txt; fi
      - name: Run
        env:
          NETLAS_API_KEY: ${{ secrets.NETLAS_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          NETLAS_QUERY: ${{ vars.NETLAS_QUERY }}
          MAX_SEEDS: ${{ inputs.max_seeds || '200' }}
        run: python Fission.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ips.txt output/netlas_state.json output/report.json
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "data: $(date -u +%F) 更新 IP 列表"
          git push
