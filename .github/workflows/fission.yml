name: Fission

on:
  workflow_dispatch:
    inputs:
      verify_host:
        description: "验证用 SNI / Host（默认 speed.cloudflare.com）"
        required: false
        default: ""
      max_seeds:
        description: "最多用多少个种子（/24 去重后）"
        required: false
        default: "200"

permissions:
  contents: read

jobs:
  fission:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Seeds
        env:
          FISSION_SEEDS: ${{ secrets.FISSION_SEEDS }}
        run: |
          if [ -z "$FISSION_SEEDS" ]; then echo "::error::请先设置仓库 secret FISSION_SEEDS（一行一个 IP，或直接贴 FOFA CSV）"; exit 1; fi
          printf '%s\n' "$FISSION_SEEDS" > seeds.txt
      - name: Run
        env:
          VERIFY_HOST: ${{ inputs.verify_host || vars.VERIFY_HOST || 'speed.cloudflare.com' }}
          CHECK_API: ${{ vars.CHECK_API }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          KNOWN_URLS: ${{ vars.KNOWN_URLS }}
          MAX_SEEDS: ${{ inputs.max_seeds }}
        run: python Fission.py
      - uses: actions/upload-artifact@v4
        with:
          name: fission-output
          path: output/
          retention-days: 3
